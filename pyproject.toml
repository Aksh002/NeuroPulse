[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "neuropulse"
version = "0.1.0"
description = "A reproducible neural predictive-maintenance research framework"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0,<2.3",
    "pydantic>=2.8,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
neural = ["torch>=2.5,<3"]
research = [
    "torch>=2.5,<3", "scikit-learn>=1.5,<2", "psutil>=6,<8",
]
reporting = ["pandas>=2.2,<3", "pyarrow>=18,<25", "matplotlib>=3.9,<4"]
backend = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "types-PyYAML>=6.0,<7",
    "types-psutil>=6,<8",
]

[tool.uv]
cache-dir = ".cache/uv"
environments = ["sys_platform == 'win32' or sys_platform == 'linux'"]

[tool.hatch.build.targets.wheel]
packages = ["src/neuropulse"]

[tool.hatch.build]
exclude = ["/.cache", "/.venv", "/data", "/artifacts", "/results", "/dist", "/.git"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "dataset: requires locally acquired, provenance-verified datasets",
    "gradient: checks manually implemented neural gradients",
    "integration: verifies component contracts",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/neuropulse"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "pandas", "matplotlib.*"]
ignore_missing_imports = true
